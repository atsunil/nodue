services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nodue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nodue_core}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodue_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nodue-network

  # ----------------------------------------------------
  # Redis Cache & Session Service
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nodue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nodue-network

  # ----------------------------------------------------
  # Fastify Node.js Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./nodue-backend-main
      dockerfile: Dockerfile
    container_name: nodue-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nodue_core}?schema=public&connection_limit=25&pool_timeout=20
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nodue_core}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-6694b00e4d9e34655910d9d1613b40f3749df0185a05931734ca172d563104fe}
      REFRESH_SECRET: ${REFRESH_SECRET:-2b41061ce4f070c8472f30f92ffa931141617f90f5f41b171a2cc629d2e1e0e0}
      COOKIE_SECRET: ${COOKIE_SECRET:-dceb58b4f25faf4d94668670a88e5b3998b7b31047ace58a0d545bed5ad0aeb5}
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SAME_SITE: lax
      RATE_LIMIT_ALLOWLIST: "127.0.0.1,localhost,backend,frontend"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nodue-network

  # ----------------------------------------------------
  # Next.js Frontend Service
  # ----------------------------------------------------
  frontend:
    build:
      context: ./nodue-frontend-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: nodue-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nodue-network

volumes:
  postgres_data:
  redis_data:

networks:
  nodue-network:
    driver: bridge
