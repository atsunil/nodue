name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nodue_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npx prisma db seed

      - name: Compile TypeScript
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nodue-backend:latest
