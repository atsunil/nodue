name: Full Stack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodue-backend-main

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nodue_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './nodue-backend-main/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodue_core_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npx prisma db seed

      - name: Compile TypeScript
        run: npm run build

  frontend-checks:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodue-frontend-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './nodue-frontend-main/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: npm run build

  docker-compose-test:
    name: Docker Compose Integration Smoke Test
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Stack
        run: docker compose build

      - name: Start Services
        run: docker compose up -d

      - name: Wait for Backend Healthcheck
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/health | grep -q "ok"; then
              echo "Backend is healthy!"
              break
            fi
            sleep 2
          done

      - name: Verify Frontend Response
        run: |
          echo "Testing Frontend endpoint..."
          curl -f http://localhost:3000/login || exit 1
          echo "Frontend responded successfully!"

      - name: Stop & Cleanup
        if: always()
        run: docker compose down -v
