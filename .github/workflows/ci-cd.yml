name: Nodue CI/CD Pipeline (Self-Hosted)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────
  # Backend CI - Build & Test
  # ──────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./nodue-backend-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./nodue-backend-main/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npm run build

  # ──────────────────────────────────────────────────────
  # Frontend CI - Build & Test
  # ──────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./nodue-frontend-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./nodue-frontend-main/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: npm run build

  # ──────────────────────────────────────────────────────
  # Deploy - Docker Compose on Self-Hosted Server
  # ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          COMPOSE_PROJECT_NAME=nodue
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REFRESH_SECRET=${{ secrets.REFRESH_SECRET }}
          COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
          EOF

      - name: Stop Existing Services
        run: docker compose down --remove-orphans || true

      - name: Build Docker Images
        run: docker compose build --no-cache

      - name: Start Services
        run: docker compose up -d

      - name: Wait for Backend Health
        run: |
          echo "⏳ Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health | grep -q "ok"; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/30 - retrying in 5s..."
            sleep 5
          done
          echo "❌ Backend failed to become healthy"
          docker compose logs backend
          exit 1

      - name: Verify Frontend
        run: |
          echo "⏳ Waiting for frontend to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "✅ Frontend is responding!"
              exit 0
            fi
            echo "  Attempt $i/30 - retrying in 5s..."
            sleep 5
          done
          echo "❌ Frontend failed to respond"
          docker compose logs frontend
          exit 1

      - name: Cleanup Old Docker Resources
        run: docker system prune -f --volumes --filter "until=168h" || true

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment Complete!"
          echo "================================"
          echo "Backend:  http://localhost:5000"
          echo "Frontend: http://localhost:3000"
          echo "Commit:   ${{ github.sha }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "================================"
          docker compose ps
